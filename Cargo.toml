[package]
name = "noos-firewall"
version = "0.1.0"
edition = "2021"
authors = ["Chomiam <axel.valens@ik.me>"]
description = "Gestion graphique native et moderne du pare-feu UFW sur Arch Linux"
license = "GPL-3.0-or-later"
repository = "https://github.com/Chomiam/noos-firewall"
homepage = "https://github.com/Chomiam/noos-firewall"
readme = "README.md"
keywords = ["archlinux", "ufw", "firewall", "gtk4", "libadwaita"]
categories = ["gui", "os::linux-apis"]

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
regex = "1.10"
