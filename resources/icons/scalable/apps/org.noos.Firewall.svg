  <circle cx="64" cy="66" r="2.6" fill="#ffffff"/>
  <path d="M64 68 L64 73" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Pastille de statut actif -->
  <circle cx="93" cy="91" r="21" fill="#0d3260" fill-opacity="0.32"/>
  <circle cx="92" cy="89" r="20" fill="url(#badgeGrad)" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M83 89 L89.5 95.5 L101 83.5" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
