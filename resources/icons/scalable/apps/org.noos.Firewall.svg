  <!-- Motif cadenas / protection interne -->
  <rect x="52" y="58" width="24" height="19" rx="4" fill="#1a5fb4" fill-opacity="0.88"/>
  <path d="M56 58 L56 51 C56 46.5 59.5 43 64 43 C68.5 43 72 46.5 72 51 L72 58"
